name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bascheck
          POSTGRES_PASSWORD: bascheck
          POSTGRES_DB: bascheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bascheck -d bascheck"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://bascheck:bascheck@localhost:5432/bascheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:apply
      - run: npm test
      - run: npm run lint
      - run: npm run build
